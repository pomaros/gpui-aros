[package]
name = "gpui_aros_smoke"
version = "0.1.0"
publish = false
edition = "2024"
license = "Apache-2.0"

# A Rust `bin`: AROS's C start-up hands argc/argv to std and runs the
# constructors; linked through the crosstools clang's AROS driver (the
# `linker` of the consumer's AROS cargo configuration, see Ferail's
# scripts/aros-cargo.sh) into the `GpuiSmoke` command.
[[bin]]
name = "GpuiSmoke"
path = "src/main.rs"

[dependencies]
gpui = { package = "gpui-pre", version = "=0.3.8", default-features = false }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.8" }

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(target_os, values("aros"))']
